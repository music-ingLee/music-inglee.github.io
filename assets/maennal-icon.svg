<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 맨날 Maennal 앱 아이콘 v2 (2026-08-06)
       다크 종이 바탕(#201c15) — 독 크기에서 도형이 크게 읽히도록 마크 92% 확대.
       F 문법의 다크 면: 위 리본=크림(원 위에서도 또렷), 네이비는 리프트(#3c4a80).
       f-4 등고·정삼각·광학 보정(삼각 칸 ±1.8%). 시안: design/logo-mock.html -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="#201c15"/>

  <!-- 도형: 원(리프트 네이비) · 정삼각(앰버) · 사각(레드) -->
  <circle cx="193.9" cy="512" r="131.6" fill="#3c4a80"/>
  <polygon points="512,380.4 663.9,643.6 360.1,643.6" fill="#e3a334"/>
  <rect x="698.4" y="380.4" width="263.2" height="263.2" fill="#d2492e"/>

  <!-- 리본: 위(전부·크림) / 가운데(앞 둘·레드) / 아래(뒤 둘·리프트 네이비) -->
  <rect x="112.5" y="460.3" width="799"   height="34.4" fill="#f2ebd9"/>
  <rect x="112.5" y="494.7" width="481.3" height="34.4" fill="#d2492e"/>
  <rect x="430.2" y="529.1" width="481.3" height="34.4" fill="#3c4a80"/>
</svg>
