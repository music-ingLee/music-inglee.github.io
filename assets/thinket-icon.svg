<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Thinket">
  <!-- Thinket mark v3 — built from the app's own low-poly language:
       tapered trapezoid trunks (#4a2e18) + upward-triangle foliage in the
       exact "나의 숲" palette (_GREENS). A small faceted grove (a forest). -->

  <!-- back-left tree (darker, recedes) -->
  <polygon points="12.8,57 16.5,57 15.6,46 13.7,46" fill="#4a2e18"/>
  <polygon points="15,29 6,48 24,48"   fill="#2f6b46"/>
  <polygon points="15,27 10,40 20,40"  fill="#4fa86d"/>

  <!-- back-right tree -->
  <polygon points="49,57 52.2,57 51.4,47 49.7,47" fill="#4a2e18"/>
  <polygon points="50,31 42,49 58,49"  fill="#3c8a59"/>
  <polygon points="50,29 45.5,42 54.5,42" fill="#6cc389"/>

  <!-- center hero tree (faceted, sits in front) -->
  <polygon points="29.5,58 34.5,58 33,41 31,41" fill="#4a2e18"/>
  <polygon points="32,14 18,43 46,43" fill="#3c8a59"/>  <!-- main mass -->
  <polygon points="24,22 15,43 33,43" fill="#2f6b46"/>  <!-- left facet, dark -->
  <polygon points="40,22 31,43 49,43" fill="#4fa86d"/>  <!-- right facet, light -->
  <polygon points="32,12 25,29 39,29" fill="#6cc389"/>  <!-- top highlight -->
</svg>
